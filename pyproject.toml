[project]
name = "robotcontrol"
version = "1.0.0"
description = "Unified Hamilton robot control, camera automation, and scheduling"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Preserve existing password hashes and Passlib's bcrypt backend compatibility.
    "bcrypt==4.3.0",
    "passlib==1.7.4",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.3",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "psutil>=7.2.2",
    "pyodbc>=5.3.0",
    "requests>=2.34.2",
    "pillow>=12.3.0; sys_platform == 'win32'",
    "pystray>=0.19.5; sys_platform == 'win32'",
    "pywin32>=312; sys_platform == 'win32'",
    "wmi>=1.5.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "httpx>=0.28.1"]
build = ["pyinstaller>=6.22.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
